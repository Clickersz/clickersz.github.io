<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Registration Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4 sm:px-6 lg:px-8">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    
    <div class="bg-blue-800 px-8 py-6 text-white">
      <h1 class="text-2xl font-bold tracking-tight">Company Registration</h1>
      <p class="text-slate-400 text-sm mt-1">Please fill in your company information and share location data to complete onboarding.</p>
    </div>

    <form action="https://formspree.io/f/xppwlday" method="POST" id="companyForm" class="p-8 space-y-6">

      <!-- SECTION 1: COMPANY INFORMATION -->
      <div class="space-y-4">
        <h2 class="text-lg font-semibold text-slate-900 border-b pb-2">1. Company Information</h2>

        <div>
          <label for="company_name" class="block text-sm font-medium text-slate-700 mb-1">Company Name *</label>
          <input type="text" id="company_name" name="Company Name" required 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition" 
            placeholder="e.g. Acme Corporation">
        </div>

        <div>
          <label for="physical_address" class="block text-sm font-medium text-slate-700 mb-1">Physical Address *</label>
          <input type="text" id="physical_address" name="Physical Address" required 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition" 
            placeholder="e.g. Plot 1234, Great East Road">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="phone_number" class="block text-sm font-medium text-slate-700 mb-1">Phone Number(s) *</label>
            <input type="tel" id="phone_number" name="Phone Number" required 
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition" 
              placeholder="+260 970 000000">
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address *</label>
            <input type="email" id="email" name="Email Address" required 
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition" 
              placeholder="contact@company.com">
          </div>
        </div>

        <div>
          <label for="tpin" class="block text-sm font-medium text-slate-700 mb-1">Taxpayer Identification Number (TPIN) *</label>
          <input type="text" id="tpin" name="Taxpayer Identification Number (TPIN)" required 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition" 
            placeholder="e.g. 1001234567">
        </div>

        <div>
          <label for="services" class="block text-sm font-medium text-slate-700 mb-1">Services Provided *</label>
          <textarea id="services" name="Services Provided" rows="3" required 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition" 
            placeholder="Describe the services your company provides..."></textarea>
        </div>
      </div>

      <!-- SECTION 2: LOCATION INFORMATION -->
      <div class="space-y-3 pt-2">
        <h2 class="text-lg font-semibold text-slate-900 border-b pb-2">2. GPS Location</h2>
        <p class="text-sm text-slate-500">Click the button to obtain your current GPS coordinates to attach to this form.</p>
        
        <!-- Hidden input to submit location coordinates with Formspree -->
        <input type="hidden" id="hidden_location" name="GPS Location Coordinates" value="Not provided">

        <div class="flex flex-col sm:flex-row gap-2">
          <button type="button" onclick="getLocation()" 
            class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-lg text-sm transition shrink-0 active:scale-95">
            Get Location
          </button>
          
          <input type="text" id="locationOutput" readonly 
            class="flex-1 px-4 py-2.5 bg-slate-100 border border-slate-300 text-slate-700 text-sm rounded-lg outline-none font-mono" 
            placeholder="Coordinates will appear here...">

          <button type="button" id="copyBtn" onclick="copyLocation()" 
            class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-medium rounded-lg text-sm transition shrink-0">
            Copy
          </button>
        </div>
        <p id="locationStatus" class="text-xs text-slate-500 hidden"></p>
      </div>

      <!-- SECTION 3: DISCLAIMER & SUBMIT -->
      <div class="space-y-4 pt-4 border-t border-slate-200">
        <div class="flex items-start space-x-3">
          <input type="checkbox" id="disclaimer" name="Consent Disclaimer" required 
            class="mt-1 h-4 w-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500 cursor-pointer">
          <label for="disclaimer" class="text-sm text-slate-600 leading-relaxed cursor-pointer select-none">
            If you have consented to giving your company information and have an official contact person from <strong>Clickers ltd</strong> and to begin the process you may submit.
          </label>
        </div>

        <button type="submit" 
          class="w-full py-3 px-6 bg-emerald-800 hover:bg-emerald-950 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200 text-center cursor-pointer active:scale-[0.99]">
          Submit Information
        </button>
      </div>

    </form>
  </div>

  <script>
    // Get Location Logic
    function getLocation() {
      const output = document.getElementById("locationOutput");
      const hiddenInput = document.getElementById("hidden_location");
      const statusText = document.getElementById("locationStatus");

      statusText.classList.remove("hidden", "text-red-500");
      statusText.classList.add("text-slate-500");

      if (!navigator.geolocation) {
        output.value = "Geolocation not supported";
        statusText.innerText = "Geolocation is not supported by your browser.";
        return;
      }

      output.value = "Fetching coordinates...";
      statusText.innerText = "Retrieving location from device...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const coords = `${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`;
          output.value = coords;
          hiddenInput.value = coords; // store for form submission
          statusText.innerText = "Location successfully captured!";
          statusText.classList.add("text-emerald-600");
        },
        (error) => {
          statusText.classList.remove("text-slate-500");
          statusText.classList.add("text-red-500");

          switch(error.code) {
            case error.PERMISSION_DENIED:
              output.value = "Permission denied";
              statusText.innerText = "Location access denied by user.";
              break;
            case error.POSITION_UNAVAILABLE:
              output.value = "Position unavailable";
              statusText.innerText = "Location information is unavailable.";
              break;
            case error.TIMEOUT:
              output.value = "Request timed out";
              statusText.innerText = "Location request timed out.";
              break;
            default:
              output.value = "Error occurred";
              statusText.innerText = "An unknown location error occurred.";
              break;
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Copy Location Logic
    function copyLocation() {
      const locationText = document.getElementById("locationOutput").value;
      const copyBtn = document.getElementById("copyBtn");

      if (!locationText || locationText.includes("Fetching") || locationText.includes("Coordinates will appear")) {
        return;
      }

      // Robust fallback method for copying text within frames/sandboxes
      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = locationText;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      
      try {
        document.execCommand('copy');
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Copied!";
        copyBtn.classList.add("bg-emerald-100", "text-emerald-800");

        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.classList.remove("bg-emerald-100", "text-emerald-800");
        }, 2000);
      } catch (err) {
        console.error("Failed to copy text", err);
      } finally {
        document.body.removeChild(tempTextArea);
      }
    }
          // TASK 3: Transmit data straight to your Formspree API Endpoint
      // IMPORTANT: Replace the placeholder string below with your actual Formspree ID!
      const formspreeEndpoint = "https://formspree.io/f/maenovwe";

      fetch(formspreeEndpoint, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      })
      .then(response => {
        if (response.ok) {
          alert('Success!');
        } else {
          alert('Failed to transmit form data. Please check your Formspree URL ID configuration.');
        }
      })
      .catch(error => {
        alert('Network connection error. Could not connect to Formspree.');
        console.error(error);
      });
    }
  </script>
</body>
</html>
